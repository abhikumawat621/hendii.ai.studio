    <!-- Polyfill/shim for sandboxed iframe window.fetch setter compatibility -->
    <script>
      (function () {
        try {
          var originalFetch = window.fetch
            ? window.fetch.bind(window)
            : null;

          var currentFetch = originalFetch;

          Object.defineProperty(window, "fetch", {
            get: function () {
              return currentFetch;
            },
            set: function (newFetch) {
              currentFetch =
                typeof newFetch === "function"
                  ? newFetch
                  : originalFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Safe fallback
        }
      })();
    </script>
